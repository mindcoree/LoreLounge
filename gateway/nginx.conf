events {
    worker_connections 1024;
}

http {
    # Логи в стандартный вывод Docker
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Базовая защита/ограничения
    client_max_body_size 2m;
    server_tokens off;

    # Rate limiting (по IP), только для целевых auth-эндпоинтов
    map $uri $auth_limit_key {
        default "";
        ~*^/api/auth/(login|register|password-reset-request)$ $binary_remote_addr;
    }

    map $uri $reset_confirm_limit_key {
        default "";
        ~*^/api/auth/password-reset-confirm$ $binary_remote_addr;
    }

    limit_req_zone $auth_limit_key zone=auth_limit:10m rate=10r/s;
    limit_req_zone $reset_confirm_limit_key zone=reset_confirm_limit:10m rate=10r/s;

    # CORS allowlist (для случаев когда фронт не через Nginx)
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
    }

    # Таймауты для upstream-соединений
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    server {
        listen 80;
        server_name localhost;

        # Security headers (минимальный набор)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;



        # ── Swagger/OpenAPI auth ─────────────────────────────────────────────
        # Оставляем только документацию и схему. Сами эндпоинты ТОЛЬКО через шлюз.
        
        location = /api/v1/openapi.json {
            proxy_pass http://auth:8000/api/v1/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/docs {
            proxy_pass http://auth:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/redoc {
            proxy_pass http://auth:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: всё что /api/ → KrakenD ────────────────────────────────────
        location /api/ {
            proxy_pass http://krakend:8080;
            proxy_http_version 1.1;

            # Применяется только когда map-ключ не пустой.
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req zone=reset_confirm_limit burst=5 nodelay;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ── Health-check для самого Nginx ────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Frontend: всё остальное → Next.js ───────────────────────────────
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # websockets / HMR (dev) — безопасно оставить
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # CORS
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;
        }
    }
}
