name: lorelounge

x-minio-common-env: &minio-common-env
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-SuperSecret123!}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_BUCKET: ${MINIO_BUCKET:-lorelounge-media}

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  АРХИТЕКТУРА: DATABASE PER SERVICE                                           ║
# ║  Каждый микросервис имеет свою изолированную базу данных.                    ║
# ║  Сервисы не имеют прямого доступа к БД друг друга.                           ║
# ║                                                                              ║
# ║  Запуск из корня проекта:                                                    ║
# ║    docker-compose -f infra/docker-compose.yml up --build                     ║
# ║  Или просто: make up (если используешь Makefile)                             ║
# ║                                                                              ║
# ║  Снаружи доступен ТОЛЬКО Nginx на порту 80.                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

networks:
  # Сервисная сеть — KrakenD видит все микросервисы, Nginx видит KrakenD
  lorelounge_net:
    driver: bridge

  # Сеть для общения микросервисов с брокером сообщений
  broker_net:
    driver: bridge
    internal: true

  profile_db_net:
    driver: bridge

services:

  # ════════════════════════════════════════════════════════════════════
  #  BROKER (RabbitMQ)
  # ════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    networks:
      - broker_net
    ports:
      - "15672:15672" # Web UI админки
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════
  #  NOTIFICATION SERVICE
  # ════════════════════════════════════════════════════════════════════
  notification:
    build:
      context: ../services/notification
      dockerfile: Dockerfile
    container_name: notification
    restart: always
    networks:
      - lorelounge_net
      - broker_net
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../services/notification/.env
      - ../services/notification/.env.docker

  # ════════════════════════════════════════════════════════════════════
  #  AUTH SERVICE + его личная БД
  # ════════════════════════════════════════════════════════════════════

  # PostgreSQL для auth
  postgres_auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    restart: always
    networks:
      - lorelounge_net
    ports:
      - "5432:5432" # Проброс порта для DataGrip
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth_admin}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secret}
      POSTGRES_DB: ${AUTH_DB_NAME:-lorelounge_auth}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      # init.sql выполняется один раз при первом старте (создаёт расширения)
      - ./postgres/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_admin} -d ${AUTH_DB_NAME:-lorelounge_auth}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — единый контейнер для всех сервисов (логические БД: auth=0, profile=1, etc.)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - lorelounge_net
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
       - "8000:8000" # ❗ Только для отладки напрямую  
    restart: always
    networks:
      - lorelounge_net
      - broker_net
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../services/auth/.env
      - ../services/auth/.env.docker
    volumes:
      - ../services/auth/certs:/app/certs:ro
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ════════════════════════════════════════════════════════════════════
  #  PROFILE SERVICE + его личная БД
  # ════════════════════════════════════════════════════════════════════

  postgres_profile:
    image: postgres:15-alpine
    container_name: postgres_profile
    restart: always
    networks:
      - profile_db_net
    ports:
      - "5433:5432" # ❗ Порт 5433 для DataGrip, так как 5432 занят auth
    environment:
      POSTGRES_USER: ${PROFILE_DB_USER:-profile_admin}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-profile_secret}
      POSTGRES_DB: ${PROFILE_DB_NAME:-lorelounge_profile}
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
      # Если у вас есть init.sql для профиля, раскомментируйте строку ниже
      # - ./postgres/profile/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROFILE_DB_USER:-profile_admin} -d ${PROFILE_DB_NAME:-lorelounge_profile}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  profile:
    build:
      context: ../services/profile
      dockerfile: Dockerfile
    container_name: profile
    ports:
       - "8001:8000" # ❗ Порт 8001 для отладки напрямую, 8000 занят auth
    restart: always
    networks:
      - lorelounge_net
      - profile_db_net
      - broker_net
    depends_on:
      postgres_profile:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ../services/profile/.env
      - ../services/profile/.env.docker
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ════════════════════════════════════════════════
  #  БУДУЩИЕ СЕРВИСЫ (шаблон)
  # ════════════════════════════════════════════════════════════════════

  # --- content-service (новеллы, главы, переводы) ---
  # postgres_content:
  #   image: postgres:15-alpine
  #   networks: [content_db_net]
  #   environment:
  #     POSTGRES_DB: lorelounge_content
  #   volumes:
  #     - postgres_content_data:/var/lib/postgresql/data
  #     - ./postgres/content/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #
  # content-service:
  #   build:
  #     context: ../services/content
  #   networks:
  #     - lorelounge_net   # виден KrakenD
  #     - content_db_net   # видит свою БД, НЕ видит auth БД

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: minio
    restart: always
    networks:
      - lorelounge_net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-SuperSecret123!}
    ports:
      # API на всех интерфейсах (для docker сети), console только localhost
      - "0.0.0.0:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # ════════════════════════════════════════════════════════════════════
  #  ИНФРАСТРУКТУРА (шлюзы)
  # ════════════════════════════════════════════════════════════════════

  # KrakenD — API Gateway (видит все сервисы, не видит БД)
  krakend:
    image: devopsfaith/krakend:2.5
    container_name: krakend
    restart: always
    networks:
      - lorelounge_net
    volumes:
      - ../gateway/krakend:/etc/krakend
    environment:
      - FC_ENABLE=1
      - FC_TEMPLATES=./partials
    command: run -c /etc/krakend/krakend.tmpl.json
    depends_on:
      auth:
        condition: service_healthy

  # Frontend (Next.js) — отдаётся через Nginx
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    networks:
      - lorelounge_net
    environment:
      # Next proxy (/api/ll/*) будет ходить в Nginx внутри docker-сети
      - LORELOUNGE_API_BASE=http://krakend:8080/api
      - PORT=3000
      - HOSTNAME=0.0.0.0

  # Nginx — единственная публичная точка входа
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    networks:
      - lorelounge_net
    ports:
      - "80:80" # единственный публичный порт
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - krakend
      - frontend

volumes:
  postgres_auth_data:
  redis_data:
  postgres_profile_data:
  minio_data:
